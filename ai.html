<!DOCTYPE html>
<html lang="zh-CN" class="no-js">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI 互动 | 织造万象</title>
  <meta name="description" content="选一块土家织锦，先看布面，再看上身，最后用 AI 把它换到你自己的造型上。" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="stylesheet" type="text/css" href="css/base.css" />
  <link rel="stylesheet" type="text/css" href="css/ai.css" />
  <script>
    document.documentElement.className = "js";
  </script>
</head>

<body class="ai pl-loading">
  <div class="ai__texture" aria-hidden="true"></div>

  <header class="ai__header">
    <div class="ai__heading">
      <p class="ai__eyebrow" id="ai-eyebrow"></p>
      <h1 class="ai__title" id="ai-title"></h1>
    </div>
    <a class="ai__back" id="ai-back" href="index.html?at=end">返回</a>
  </header>

  <main class="sample">
    <!-- Desktop table of contents. On phones it collapses into the rail. -->
    <aside class="sample__index" aria-label="纹样目录">
      <ol class="sample__list" id="sample-list"></ol>
    </aside>

    <!-- The same cloth has two faces: the scan and the model wearing it. -->
    <section class="sample__stage" id="sample-stage" data-side="fabric">
      <div class="sample__layers" id="sample-layers">
        <img class="sample__person" id="sample-person" alt="" />
        <div class="sample__cloth" id="sample-cloth" aria-hidden="true">
          <div class="sample__ambient" id="sample-ambient"></div>
          <div class="sample__fabric" id="sample-fabric"></div>
        </div>
      </div>
      <div class="sample__shade" aria-hidden="true"></div>

      <!-- The worn look is visible from the start; tapping the card expands
           the same person to the full screen. -->
      <button class="sample__look" id="sample-look" type="button" aria-label="展开上身效果">
        <img id="sample-look-img" alt="" />
        <span class="sample__look-label">上身 <b aria-hidden="true">↗</b></span>
      </button>

      <div class="sample__copy">
        <p class="sample__number" id="sample-number"></p>
        <h2 class="sample__name" id="sample-name"></h2>
        <p class="sample__meta" id="sample-meta"></p>
      </div>

      <div class="sample__controls">
        <div class="sample__switch" role="group" aria-label="查看布面或上身">
          <button class="sample__switch-btn is-active" data-side="fabric" type="button">布面</button>
          <button class="sample__switch-btn" data-side="person" type="button">上身</button>
        </div>
        <a class="sample__cta" id="sample-cta" href="#">用这块布换成我 <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>

  <nav class="sample__rail" id="sample-rail" aria-label="快速选择纹样"></nav>

  <script type="module" src="/js/ai/index.js"></script>
</body>

</html>
