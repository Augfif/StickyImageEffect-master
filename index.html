<!DOCTYPE html>
<html lang="zh-CN" class="no-js">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>土家织锦</title>
  <meta name="description" content="十幅织物，十种祝愿——一场沿着纹样推进的滚动叙事。" />
  <link rel="shortcut icon" href="favicon.ico" />
  <!-- base.css brings the shared reset, the hidden native cursor and the
       self drawn ring; intro.css only owns this page. -->
  <link rel="stylesheet" type="text/css" href="css/base.css" />
  <link rel="stylesheet" type="text/css" href="css/intro.css" />
  <script>
    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }
    document.documentElement.className = "js";
  </script>
</head>

<body class="intro">
  <!-- ScrollSmoother's wrapper / content; the tall div below is what gives the
       page its scroll length. Everything else is fixed on top of it. -->
  <div id="smooth-wrapper">
    <div id="smooth-content">
      <div class="intro-scroll" id="intro-scroll"></div>
    </div>
  </div>

  <!-- One continuous cloth. The panels are built from introBeats, so the
       sequence scrolls through a single object instead of swapping slides. -->
  <div class="loom" id="loom" aria-hidden="true">
    <div class="loom__warp"></div>
    <div class="loom__cloth" id="loom-cloth"></div>
    <div class="loom__beam loom__beam--top"></div>
    <div class="loom__beam loom__beam--bottom"></div>
  </div>
  <div class="intro-vignette"></div>

  <!-- One block per beat, filled in by js/intro/index.js -->
  <div class="intro-text" id="intro-text"></div>

  <div class="intro-hint" id="intro-hint">
    <svg viewBox="0 0 24 32" aria-hidden="true">
      <path d="M 12 3 L 12 26 M 12 26 L 6.5 20.5 M 12 26 L 17.5 20.5" />
    </svg>
    <span id="intro-hint-label"></span>
  </div>

  <div class="intro-progress">
    <div class="intro-progress__rail">
      <span class="intro-progress__fill" id="intro-progress-fill"></span>
    </div>
    <span class="intro-progress__value" id="intro-progress-value">000%</span>
  </div>

  <!-- The fork at the end of the cloth: two fabric cards instead of two
       floating pills. Kept in the DOM as links so phones get real tap targets
       and keyboards can reach both destinations. -->
  <section class="loom-choice" id="intro-choice" aria-hidden="true">
    <div class="loom-choice__panel">
      <p class="loom-choice__kicker" id="intro-choice-kicker"></p>
      <h2 class="loom-choice__title" id="intro-choice-title"></h2>

      <div class="loom-choice__cards">
        <a class="loom-card loom-card--gallery" id="intro-choice-main" href="main.html" tabindex="-1">
          <span class="loom-card__media"></span>
          <span class="loom-card__copy">
            <span class="loom-card__top">
              <span class="loom-card__index">01</span>
              <span class="loom-card__arrow" aria-hidden="true">↗</span>
            </span>
            <span class="loom-card__name" id="intro-choice-main-label"></span>
            <span class="loom-card__hint" id="intro-choice-main-hint"></span>
          </span>
        </a>

        <a class="loom-card loom-card--ai" id="intro-choice-ai" href="ai.html" tabindex="-1">
          <span class="loom-card__media"></span>
          <span class="loom-card__swatch" aria-hidden="true"></span>
          <span class="loom-card__copy">
            <span class="loom-card__top">
              <span class="loom-card__index">02</span>
              <span class="loom-card__arrow" aria-hidden="true">↗</span>
            </span>
            <span class="loom-card__name" id="intro-choice-ai-label"></span>
            <span class="loom-card__hint" id="intro-choice-ai-hint"></span>
          </span>
        </a>
      </div>

      <button class="loom-choice__replay" id="intro-choice-replay" type="button" tabindex="-1"></button>
    </div>
  </section>

  <button class="intro-skip" id="intro-skip" type="button" tabindex="-1"></button>

  <div class="intro-loader" id="intro-loader"><span></span></div>
  <div class="intro-curtain" id="intro-curtain"></div>

  <div class="cursor">
    <div class="cursor__inner cursor__inner--circle"></div>
  </div>

  <script type="module" src="/js/intro/index.js"></script>
</body>

</html>
